# Cau hinh de xuat cho paper-trader: Slow Trend da tai san (nguon: docs/research/MULTI_ASSET_BACKTEST.md)
# THAM SO CO DINH THEO VAN LIEU, KHONG toi uu tren du lieu. Dung lam lop DA DANG HOA / bao hiem duoi, KHONG phai nguon alpha doc lap.
# Mo hinh tinh toan: moi tai san la chuoi loi suat "excess" (vuot tien mat USD) = hop dong tuong lai / ETF co don bay.
strategy:
  id: slow_trend_multiasset
  version: 1
  status: paper_only              # chua du bang chung de dung tien that (xem muc 'validation_gates')
  role: diversifier               # tuong quan ~ -0.08 voi 60/40 (thang); ky vong Sharpe sau chi phi 0.3-0.5, KHONG ky vong thang 60/40
  data_frequency: daily_close     # tin hieu tren dong cua cuoi ngay, thuc thi o dong cua phien KE TIEP (lag 2 trong backtest)
  rebalance: monthly              # phien giao dich cuoi thang (ban weekly cho ket qua tuong duong: Sharpe 0.55)
  execution_lag_sessions: 1       # vao lenh o close phien sau ngay ra tin hieu
  history_required_days: 300      # tai san chua du ~252 phien khong duoc giao dich (khong co tin hieu)

signal:                           # tin hieu tung tai san, gia tri trong [-1, +1]; la TRUNG BINH 4 bo tin hieu (da chot truoc khi chay)
  index_series: cumulative_excess_return   # I_t = cumprod(1 + r_excess); gan dung bang gia/ETF adj close neu khong co series excess
  components:
    - {name: tsmom_12_1,      rule: "sign(I[t-21]/I[t-252] - 1)"}                       # Moskowitz-Ooi-Pedersen 12-1 thang
    - {name: tsmom_multi,     rule: "mean(sign(I[t]/I[t-L]-1) for L in (21,63,252))"}   # Hurst-Ooi-Pedersen 1/3/12 thang
    - {name: ma200,           rule: "sign(I[t] - SMA_200(I))"}
    - {name: donchian_200_100, rule: "vao dai khi close > max 200 ngay truoc, vao ngan khi < min 200; thoat khi cat min/max 100 ngay; trang thai giu den khi thoat"}
  combine: mean
  variants:
    long_short: {clip: "[-1, 1]"}          # PRIMARY
    long_flat:  {clip: "[0, 1]"}           # doi chung: Sharpe cao hon (0.80) nhung phan lon la beta mua-giu (placebo 0.57), khong co crisis alpha

sizing:
  target_vol_annual: 0.10
  asset_vol: {method: ewma, span_days: 60, floor: 0.01, annualization: 252}
  risk_budget: class_balanced      # 6 lop (eq, bond, fx, metal, energy, agri) ngang rui ro; trong lop chia deu; lop chua co du lieu thi bo qua
  raw_weight: "signal_i * budget_i * target_vol / sigma_i"
  portfolio_scale: "L = min(lmax, target_vol / sqrt(w' Cov w))"   # Cov: EWMA halflife 60d (500 ngay), shrink 20% ve duong cheo
  lmax: 3.0
  per_asset_cap_notional: 3.0      # |w_i| <= 3x von
  gross_cap_notional: 8.0          # thuc te trung binh 2.3x, toi da ~4x
  retail_unlevered_alt: {lmax: 1.0, gross_cap: 2.0, expected_vol: 0.034}   # Sharpe giu nguyen (0.56) nhung loi nhuan ~ 1/3

costs_assumed_conservative:        # backtest tru het cac muc nay; paper-trader nen ghi nhan chi phi thuc te de doi chieu
  one_way_bps: {eq: "2.5-12 (xem universe)", bond: "1-3", fx: "1-2", metal: "3-8", energy: "6-15", agri: "10-12"}
  pre_2010_multiplier: 1.5
  gross_friction_pct_per_year: 0.30     # phi duy tri/markup tren tong notional
  stress: {cost_x2_sharpe: 0.44, cost_x3_sharpe: 0.33}   # chien luoc nhay voi chi phi: KHONG dung neu chi phi thuc te > ~2x gia dinh

