optional_not_in_core: [BTC, ETH]   # them vao: Sharpe 0.55 -> 0.63 (toan mau) / 0.39 -> 0.43 (2018+): khong du de dua vao loi

paper_trader_logging:               # de doi chieu voi bao cao
  benchmarks: ["60/40 (SPX/UST10)", "risk_parity_long_only", "spx_excess"]
  log_daily: [target_weights, executed_weights, fill_costs, gross_leverage, realized_vol_20d, per_class_pnl]
  run_both_variants: [long_short (PRIMARY), long_flat (doi chung)]

backtest_reference:                 # 1990-02 .. 2026-10, sau chi phi, tham so tren (nguon: research/results/ma_analysis.json)
  long_short: {sharpe: 0.55, sharpe_ci95: [0.21, 0.87], total_cagr: 0.080, vol: 0.095, maxdd: -0.235, loss_years: 0.29, max_underwater_years: 4.4}
  long_flat:  {sharpe: 0.80, sharpe_ci95: [0.47, 1.13], total_cagr: 0.091, vol: 0.076, maxdd: -0.167, max_underwater_years: 9.2}
  by_era_sharpe_long_short: {"1990-1999": 0.67, "2000-2009": 0.74, "2010-2019": 0.16, "2020-2026": 0.59, "2012-2026_full_universe": 0.29}
  sixty_forty: {sharpe: 0.60, total_cagr: 0.090, vol: 0.105, maxdd: -0.315}
  expected_forward_realistic: {net_sharpe: "0.3-0.5", excess_return_at_10pct_vol: "3-5%/nam", maxdd: "-20% .. -30%", loss_years: "~30%", note: "thap hon trung binh lich su; giai doan 2010-2019 gan nhu khong sinh loi"}

validation_gates:                   # dieu kien truoc khi nghi den tien that (paper chi kiem chung ky thuat/tracking, KHONG du de chung minh loi nhuan)
  - "Tracking: tin hieu/trong so paper-trader khop backtest tai cung ngay (sai khac < 1% notional/tai san) tren >= 6 thang"
  - "Chi phi thuc te <= 1.5x gia dinh (neu > 2x thi Sharpe < 0.45: bo)"
  - "Tuong quan thang voi 60/40 duoc ghi nhan va van < 0.3 (gia tri co y nghia cua chien luoc la tinh da dang hoa)"
  - "Chi dung nhu mot phan (20-30%) cua tong rui ro danh muc co co phieu/trai phieu, khong thay the 60/40"
