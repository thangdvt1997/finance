[project]
name = "expert-collector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tscommon", "httpx>=0.27", "feedparser>=6.0", "beautifulsoup4>=4.12", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "fakeredis>=2.23", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
