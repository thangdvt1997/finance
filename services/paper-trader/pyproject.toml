[project]
name = "paper-trader"
version = "0.1.0"
requires-python = ">=3.12"
description = "Giao dịch MÔ PHỎNG (forward test) — không tiền thật, không broker"
dependencies = ["tscommon", "numpy>=2.0", "pandas>=2.2", "empyrical-reloaded>=0.5.11", "pytz", "asyncpg>=0.29", "pyyaml>=6", "redis>=5.0", "pydantic>=2.7", "prometheus-client>=0.20", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "fakeredis>=2.23", "pytest-asyncio>=0.23"]

[project.entry-points."papertrader.strategies"]
# Plugin ngoài khai báo ở đây (package riêng): ten = "module:ClassName"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_trader = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
