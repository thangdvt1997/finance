# paper-trader: cấu hình MÔ PHỎNG (không tiền thật). Sửa file này rồi restart service.
# Mọi chi phí đặt BẢO THỦ (spread rộng, trượt giá, swap/funding tốn tiền hai chiều). Xem README để chỉnh/giải thích.
interval_seconds: 300
tf: D1                      # khung giờ của bar dùng để ra quyết định và khớp (khớp ở GIÁ MỞ CỬA bar kế tiếp)
history_bars: 2000          # số bar nạp/lần/symbol (~8 năm D1): slow_trend_multiasset cần >=~254 bar; Donchian có trạng thái nên cần cửa sổ dài để hội tụ về backtest
periods_per_year: 252
alerts_enabled: true
risk_windows_url: "http://api-gateway:8000/v1/risk-windows?horizon_hours=24"   # lỗi/không có -> chỉ dùng news_windows tĩnh
risk_windows_token_env: API_TOKEN     # tên biến môi trường chứa X-API-Key (GET only)
news_windows: []            # stub tĩnh: [{start: "2026-11-06T13:30:00Z", end: "2026-11-06T13:45:00Z", currencies: [USD], title: NFP}]

# Ghi đè chi phí theo symbol (mặc định theo nhóm fx / metal / equity_vn trong config.py)
instruments:
  EURUSD: {spread_bps: 1.5}
  GBPUSD: {spread_bps: 2.0}
  USDJPY: {spread_bps: 1.5}
  XAUUSD: {spread_bps: 3.0}
  # --- Chi phí một chiều ≈ bps trong research/strategies/slow_trend_multiasset.yaml (spread/2 + trượt + phí = B)
  "US:SPY": {spread_bps: 2.5, slippage_bps: 0.625, commission_bps: 0.625}
  "US:QQQ": {spread_bps: 3, slippage_bps: 0.75, commission_bps: 0.75}
  "US:IWM": {spread_bps: 4, slippage_bps: 1.0, commission_bps: 1.0}
  "US:EWG": {spread_bps: 3, slippage_bps: 0.75, commission_bps: 0.75}
  "US:FEZ": {spread_bps: 3, slippage_bps: 0.75, commission_bps: 0.75}
  "US:EWQ": {spread_bps: 3, slippage_bps: 0.75, commission_bps: 0.75}
  "US:EWU": {spread_bps: 3, slippage_bps: 0.75, commission_bps: 0.75}
  "US:EWJ": {spread_bps: 4, slippage_bps: 1.0, commission_bps: 1.0}
  "US:EWH": {spread_bps: 6, slippage_bps: 1.5, commission_bps: 1.5}
  "US:EWA": {spread_bps: 4, slippage_bps: 1.0, commission_bps: 1.0}
  "US:EWY": {spread_bps: 6, slippage_bps: 1.5, commission_bps: 1.5}
  "US:INDA": {spread_bps: 8, slippage_bps: 2.0, commission_bps: 2.0}
