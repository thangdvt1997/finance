accounts:
  # --- FX + vàng, tài khoản USD ---------------------------------------------------------------------
  # DEPRECATED 2026-10-11: chạy plugin cũ (momentum 12-1 + MA200, vol-target nghịch đảo vol, KHÔNG ensemble/ngân sách lớp) => không khớp backtest.
  # Journal bất biến được GIỮ nguyên (đừng xoá); tài khoản bị đóng băng (không chạy thêm bước). Thay bằng *_v2 bên dưới.
  - id: slow_trend_fx
    name: "[DEPRECATED] Trend chậm FX+Vàng (USD) — plugin cũ, thay bằng slow_trend_fx_v2"
    deprecated: true
    meaningful: false
    strategy: slow_trend_simple
    params: {momentum_days: 252, skip_days: 21, ma_days: 200, allow_short: true}
    base_ccy: USD
    initial_capital: 10000
    universe: [EURUSD, GBPUSD, USDJPY, XAUUSD]
    rebalance: monthly
    benchmark: bh_fx
    risk:
      sizing: {mode: vol_target, target_vol: 0.10, vol_window: 60, max_scale: 3.0}
      max_leverage: 3.0
      max_weight: 1.0
      max_daily_loss: 0.03
      max_weekly_loss: 0.06
      max_drawdown: 0.15
      max_orders_per_minute: 30
      min_trade_weight: 0.01
  - id: slow_trend_fx_v2
    name: "Trend chậm FX+Vàng v2 (ensemble 4 tín hiệu, ngân sách lớp, vol-target 10%) — khớp backtest"
    strategy: slow_trend_multiasset
    params_file: /cfg/strategies/slow_trend_multiasset.yaml
    params: {asset_cap: 0.8, gross_cap: 1.5, class_gross_cap: 1.0, min_live: 3}
    base_ccy: USD
    initial_capital: 10000
    universe: [EURUSD, GBPUSD, USDJPY, XAUUSD]
    rebalance: monthly
    benchmark: bh_fx
    risk:
      sizing: {mode: passthrough}              # plugin trả kind=weight đã vol-target; risk engine chỉ còn cổng an toàn
      max_leverage: 1.5
      max_weight: 0.8
      max_daily_loss: 0.03
      max_weekly_loss: 0.06
      max_drawdown: 0.15
      max_orders_per_minute: 30
      min_trade_weight: 0.005
  - id: bh_fx
    name: "Đối chứng: giữ đều FX+Vàng (USD)"
    strategy: buy_and_hold
    params: {gross: 1.0}
    base_ccy: USD
    initial_capital: 10000
    universe: [EURUSD, GBPUSD, USDJPY, XAUUSD]
    rebalance: first_only
