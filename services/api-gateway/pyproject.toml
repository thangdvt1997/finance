[project]
name = "api-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tscommon", "asyncpg>=0.29", "websockets>=12", "redis>=5.0", "hiredis>=2.3", "orjson>=3.10", "zstandard>=0.22", "pydantic>=2.7", "prometheus-client>=0.20", "fastapi>=0.110", "uvicorn>=0.29",
  # tracing (tắt mặc định; bật bằng OTEL_EXPORTER_OTLP_ENDPOINT — xem api_gateway/tracing.py, docs/OBSERVABILITY.md)
  "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27", "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-asyncpg>=0.48b0", "opentelemetry-instrumentation-redis>=0.48b0", "opentelemetry-instrumentation-httpx>=0.48b0"]

[project.optional-dependencies]
test = ["pytest>=8", "fakeredis>=2.23", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_gateway = ["ui/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
