<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading System - Tổng quan</title>
<style>
  :root { --bg:#0f1419; --card:#18202a; --fg:#e6edf3; --mut:#8b98a5; --ok:#3fb950; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid #263040; flex-wrap:wrap }
  header h1 { font-size:16px; margin:0 12px 0 0 } input,button { background:#0d1117; color:var(--fg); border:1px solid #30363d; border-radius:6px; padding:6px 10px }
  button { cursor:pointer } #st { color:var(--mut); margin-left:auto }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; padding:12px 16px }
  section { background:var(--card); border-radius:8px; padding:10px 12px; min-height:120px }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 8px }
  table { width:100%; border-collapse:collapse } td,th { padding:3px 4px; text-align:left; border-bottom:1px solid #222c39 } td.n { text-align:right; font-variant-numeric:tabular-nums }
  ul { list-style:none; margin:0; padding:0 } li { padding:3px 0; border-bottom:1px solid #222c39 }
  .mut { color:var(--mut) } .buy { color:var(--ok) } .sell { color:var(--bad) } #log { max-height:320px; overflow:auto; font:12px ui-monospace,monospace }
  .wide { grid-column:1/-1 }
</style>
</head>
<body>
<header>
  <h1>Trading System</h1>
  <input id="key" type="password" placeholder="X-API-Key" size="24" autocomplete="off">
  <button id="go">Kết nối</button>
  <span id="st">chưa kết nối</span>
</header>
<main>
  <section><h2>Giá mới nhất</h2><table id="quotes"></table></section>
  <section><h2>Tin nóng</h2><ul id="news"></ul></section>
  <section><h2>Sự kiện sắp tới (48h)</h2><ul id="events"></ul></section>
  <section><h2>Tín hiệu chuyên gia đang mở</h2><ul id="signals"></ul></section>
  <section><h2>Tài khoản (read-only)</h2><table id="accounts"></table></section>
  <section class="wide"><h2>Luồng realtime</h2><div id="log"></div></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let key = sessionStorage.getItem("apikey") || "", ws = null, timer = null;
$("key").value = key;

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function fill(listId, items, render) {
  const box = $(listId); box.replaceChildren();
  if (!items.length) { box.append(el("li", "(trống)", "mut")); return; }
  items.forEach((x) => box.append(render(x)));
}
function row(cells) { const tr = document.createElement("tr"); cells.forEach(([t, c]) => tr.append(el("td", t, c))); return tr; }
const fmt = (v, d = 5) => (v === null || v === undefined ? "-" : Number(v).toFixed(d));
const hhmm = (s) => (s ? new Date(s).toLocaleString("vi-VN", { hour12: false }) : "-");

async function loadOverview() {
  try {
    const r = await fetch("/v1/overview", { headers: { "X-API-Key": key } });
    if (!r.ok) { $("st").textContent = "HTTP " + r.status + (r.status === 401 ? " (sai API key)" : ""); return; }
    const o = await r.json();
    const q = $("quotes"); q.replaceChildren(row([["Symbol"], ["Bid", "n"], ["Ask", "n"]]));
    o.quotes.forEach((x) => q.append(row([[x.symbol], [fmt(x.bid), "n"], [fmt(x.ask), "n"]])));
    fill("news", o.news, (n) => { const li = el("li"); li.append(el("span", hhmm(n.published_at) + " ", "mut"), el("span", n.title)); return li; });
    fill("events", o.upcoming_events, (e) => { const li = el("li"); li.append(el("span", hhmm(e.ts) + " ", "mut"), el("b", "[" + e.impact + "] "), el("span", (e.country || "") + " " + e.title)); return li; });
    fill("signals", o.expert_signals, (s) => { const li = el("li"); li.append(el("b", s.side.toUpperCase() + " ", s.side), el("span", s.symbol + " @ " + fmt(s.entry) + " (" + s.expert_id + ")")); return li; });
    const a = $("accounts"); a.replaceChildren(row([["Tài khoản"], ["Balance", "n"], ["Equity", "n"], ["Margin", "n"]]));
    o.accounts.forEach((x) => a.append(row([[x.account_id + " " + x.platform], [fmt(x.balance, 2), "n"], [fmt(x.equity, 2), "n"], [fmt(x.margin, 2), "n"]])));
    $("st").textContent = "cập nhật " + new Date().toLocaleTimeString("vi-VN");
  } catch (e) { $("st").textContent = "lỗi mạng"; }
}

function log(line) {
  const d = el("div", line); const box = $("log"); box.prepend(d);
  while (box.children.length > 200) box.lastChild.remove();
}

function connectWs() {
  if (ws) ws.close();
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/stream");
  ws.onopen = () => ws.send(JSON.stringify({ type: "auth", api_key: key }));
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.type === "ready") log("-- đã kết nối: " + d.streams.join(", "));
    else if (d.type === "event") {
      const p = d.event.payload || {};
      log(d.stream + " " + (p.symbol || p.title || p.account_id || "") + " " + JSON.stringify(p).slice(0, 140));
    }
  };
  ws.onclose = () => log("-- mất kết nối realtime");
}

$("go").onclick = () => {
  key = $("key").value.trim(); sessionStorage.setItem("apikey", key);
  clearInterval(timer); loadOverview(); connectWs(); timer = setInterval(loadOverview, 15000);
};
if (key) $("go").click();
</script>
</body>
</html>
