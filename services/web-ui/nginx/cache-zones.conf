# Tầng cache nginx (docs/PERFORMANCE.md). Được include ở cấp http (đầu default.conf.template). KHÔNG chứa bí mật.
#
# 1) api_cache: micro-cache cho dữ liệu DÙNG CHUNG (không theo tài khoản). Khoá = vai trò xác thực (master|client) + URI+query
#    => client chỉ nhận bản do client khác (cùng vai trò) tạo; route theo tài khoản (overview/accounts/equity/risk accounts/journal/me/user) KHÔNG đi qua vùng này.
#    TTL do gateway quyết định bằng X-Accel-Expires (nginx xoá header này khỏi phản hồi cho trình duyệt).
# 2) auth_cache (CHỈ trang/tài nguyên tĩnh; /api/* luôn hỏi auth): kết quả auth_request (200, vai trò master|client) giữ 2s theo (cookie phiên, lớp URI). Giảm ~1 request/asset tới service auth.
#    Không bao giờ lưu: anon/thiếu X-Role, 401, không có cookie. Thu hồi phiên có hiệu lực chậm thêm tối đa 2s ở lớp này.
# tmpfs /var/cache/ts-proxy (docker-compose: size giới hạn) => đĩa không bị đầy, mất khi recreate (an toàn: chỉ là cache).
proxy_cache_path /var/cache/ts-proxy/api  levels=1:2 keys_zone=api_cache:16m max_size=96m inactive=5m use_temp_path=off;
proxy_cache_path /var/cache/ts-proxy/auth levels=1:2 keys_zone=auth_cache:2m max_size=8m  inactive=1m use_temp_path=off;

map $request_uri $auth_uri_class { default other; "~^/auth/" auth; }                  # /auth/* khác các đường dẫn khác khi must_change_password
map $upstream_http_x_role $auth_nostore { default 0; "" 1; anon 1; }                  # không lưu phản hồi anon / thiếu vai trò
map $cookie_ts_session $auth_nocookie { default 0; "" 1; }                            # không cookie => không cache (đường dự phòng basic-auth)
map $request_uri $auth_is_api { default 0; "~^/api/" 1; }                              # /api/* LUÔN hỏi service auth (thu hồi phiên có hiệu lực tức thì); cache 2s chỉ cho trang/tài nguyên tĩnh
map $auth_role $api_role_bad { default 1; master 0; client 0; }                       # chỉ cache khi vai trò hợp lệ


# Cache file tĩnh trong bộ nhớ (stat/open) — giảm syscall cho SPA nhiều chunk
open_file_cache          max=2000 inactive=60s;
open_file_cache_valid    60s;
open_file_cache_min_uses 1;
open_file_cache_errors   on;
