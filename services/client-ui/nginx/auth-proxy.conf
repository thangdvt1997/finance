# Thiết lập chung khi chuyển tiếp /c/auth/* xuống dịch vụ auth (include sau proxy_pass).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Authorization "";
proxy_connect_timeout 3s;
proxy_read_timeout 10s;
proxy_hide_header X-Powered-By;
# Cookie phiên luôn HttpOnly + SameSite=Strict dù auth có quên (cờ Secure do auth đặt; không ép ở đây để thử được qua http://127.0.0.1)
proxy_cookie_flags ~ httponly samesite=strict;
