[project]
name = "track-record"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tscommon", "asyncpg>=0.29", "numpy>=2.0", "redis>=5.0", "prometheus-client>=0.20", "fastapi>=0.110", "uvicorn>=0.29", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
