# Cấu hình risk-monitor (đường dẫn qua RISK_CONFIG). Mọi khoá đều tuỳ chọn; ở đây chỉ ghi các giá trị nên chỉnh.
# READ-ONLY: service chỉ đọc DB + phát cảnh báo; không có đường nào đặt/sửa/đóng lệnh.
interval_seconds: 60
default_currency: USD          # dùng khi tài khoản MT chưa báo tiền tệ
mt:
  stop_out_pct: 50             # mức margin (%) broker cưỡng bức đóng lệnh — LẤY THEO BROKER CỦA BẠN
  margin_call_pct: 100
  margin_level_warn_pct: 200
budget:
  mt:    { day_loss_pct: 3, week_loss_pct: 6, dd_pct: 15, leverage_gross: 10, margin_level_min: 200, es_1d_pct: 4, ccy_conc_pct: 400, positions: 20 }
  paper: { day_loss_pct: 2, week_loss_pct: 4, dd_pct: 10, leverage_gross: 2, es_1d_pct: 3, ccy_conc_pct: 150, positions: 40 }
  accounts: {}                 # ghi đè theo tài khoản, ví dụ  demo-mt4-01: { dd_pct: 8 }
alerts:
  enabled: true
  kinds: [mt, paper]
  paper_meaningful_only: true  # tài khoản paper replay/smoke (meaningful=false) không phát cảnh báo
  min_level: warn              # warn | crit
instruments: {}                # ví dụ  US30: { kind: index, quote: USD, contract: 1 }
# Kịch bản stress: xem SCENARIOS trong src/risk_monitor/config.py; muốn thay toàn bộ, khai báo `scenarios:` ở đây.
fleet:
  history_days: 45             # lịch sử equity nạp cho mẫu luật đội tài khoản (tối thiểu 45); luật/tài khoản cấu hình trong auth, env FLEET_* (xem README)
