[project]
name = "nlp"
version = "0.1.0"
requires-python = ">=3.12"
description = "Làm giàu tin: sentiment (ONNX CPU), symbols, chủ đề, mức quan trọng, tóm tắt trích xuất. READ-ONLY."
dependencies = [
  "tscommon",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "vaderSentiment>=3.3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "fakeredis>=2.23", "pytest-asyncio>=0.23"]
# Chỉ dùng cho scripts/export_onnx.py (container tạm, KHÔNG nằm trong image chạy):
export = ["torch", "transformers", "optimum[onnxruntime]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
