[project]
name = "tscommon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "redis>=5.0", "prometheus-client>=0.20", "fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "fakeredis>=2.23", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tscommon = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
