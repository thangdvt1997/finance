# Danh sach TEN NGUON du lieu KHONG duoc hien thi cho nguoi dung (xem docs/UI_NO_SOURCES.md).
# Ghi de bang env SOURCES_CONFIG=/duong/dan/file.yaml (cung cau truc). Thay doi co hieu luc sau khi khoi dong lai
# (hoac goi tscommon.sources.reload()). Chi ap dung cho noi dung HIEN THI; log/Prometheus/Gatus/Grafana giu nguyen.

# Thay the khi con sot ten nguon sau cac luat tren (trung tinh).
replacement: "nguồn dữ liệu"

# Ten nguon RO RANG (khop khong phan biet hoa/thuong, ranh gioi tu, cho phep hau to _id va ten mien .com/.vn/...).
# "_" va khoang trang trong ten khop ca "_", "-", " " hoac dinh lien.
strict:
