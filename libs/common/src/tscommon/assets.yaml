# REGISTRY loai tai san (nguon chan ly duy nhat cho api-gateway / UI / analytics).
# Anh xa symbol chuan hoa (xem docs/CONTRACTS.md) -> class, ten hien thi, nhom, tien te bao gia, phien giao dich, so le hien thi.
# Ghi de bang bien moi truong ASSETS_CONFIG=/duong/dan/assets.yaml (file day du, thay the file nay).
#
# class (hop dong cho UI): forex | crypto | metal | commodity | index | etf | stock_us | stock_vn | bond  (+ "other" cho symbol chua dang ky)
# Moi muc symbol: s (bat buoc), name (tieng Viet), name_en, group; co the ghi de precision / session / quote.
version: 1

# Phien giao dich (UTC tru khi ghi tz). Ngay le san KHONG duoc mo hinh hoa (session_open chi xet gio + thu trong tuan).
sessions:
  crypto_24x7: {name: "24/7", name_en: "24/7", kind: always}
  fx_24x5:     {name: "24/5 (CN 22:00 - T6 22:00 UTC)", name_en: "24/5 (Sun 22:00 - Fri 22:00 UTC)", kind: week, open: "Sun 22:00", close: "Fri 22:00"}
  us_equity:   {name: "San My T2-T6 09:30-16:00 (New York)", name_en: "US exchange Mon-Fri 09:30-16:00 (New York)", kind: daily, tz: us_eastern, days: [0, 1, 2, 3, 4], windows: ["09:30-16:00"]}
  vn_equity:   {name: "San VN T2-T6 09:00-11:30, 13:00-15:00 (UTC+7)", name_en: "Vietnam exchange Mon-Fri 09:00-11:30, 13:00-15:00 (UTC+7)", kind: daily, tz: "+07:00", days: [0, 1, 2, 3, 4], windows: ["09:00-11:30", "13:00-15:00"]}
  eod_daily:   {name: "So lieu cuoi ngay (ngay lam viec)", name_en: "End-of-day data (business days)", kind: eod}

classes:
  forex:     {name: "Ngoại hối (Forex)", name_en: "Forex", order: 1, session: fx_24x5, precision: 5}
  crypto:    {name: "Tiền ảo (Crypto)", name_en: "Crypto", order: 2, session: crypto_24x7, precision: 2, quote: USDT}
  metal:     {name: "Kim loại", name_en: "Metals", order: 3, session: us_equity, precision: 2, quote: USD}
  commodity: {name: "Hàng hoá", name_en: "Commodities", order: 4, session: us_equity, precision: 2, quote: USD}
  index:     {name: "Chỉ số", name_en: "Indices", order: 5, session: us_equity, precision: 2, quote: USD}
  etf:       {name: "ETF", name_en: "ETFs", order: 6, session: us_equity, precision: 2, quote: USD}
  stock_us:  {name: "Cổ phiếu Mỹ", name_en: "US stocks", order: 7, session: us_equity, precision: 2, quote: USD}
  stock_vn:  {name: "Cổ phiếu Việt Nam", name_en: "Vietnam stocks", order: 8, session: vn_equity, precision: 0, quote: VND}
  bond:      {name: "Trái phiếu", name_en: "Bonds", order: 9, session: us_equity, precision: 2, quote: USD}
  other:     {name: "Khác", name_en: "Other", order: 99, session: eod_daily, precision: 4}

# Symbol KHONG liet ke ben duoi duoc suy ra theo mau (khop dau tien thang).
patterns:
  - {match: "CRYPTO:*", class: crypto}
  - {match: "VN:*", class: stock_vn}
  - {match: "US:*", class: stock_us}
  - {match: "FRED:*", class: bond}
  - {regex: "^[A-Z]{6}$", class: forex}

symbols:
