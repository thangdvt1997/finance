    - {s: AUDUSD, name: "Đô la Úc / Đô la Mỹ", name_en: "Australian Dollar / US Dollar", group: Majors}
    - {s: USDCAD, name: "Đô la Mỹ / Đô la Canada", name_en: "US Dollar / Canadian Dollar", group: Majors}
    - {s: NZDUSD, name: "Đô la New Zealand / Đô la Mỹ", name_en: "New Zealand Dollar / US Dollar", group: Majors}
