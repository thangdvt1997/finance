apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: TimescaleDB
    uid: pg
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: ${POSTGRES_USER}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      timescaledb: true
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
