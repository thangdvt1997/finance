# journal (nhật ký giao dịch). Nếu gỡ service khỏi compose thì xóa file này.
endpoints:
  - name: journal
    group: services
    url: "http://journal:8000/healthz"
    interval: 30s
    conditions: ["[STATUS] == 200", "[RESPONSE_TIME] < 2000"]
    alerts:
      - { type: custom, failure-threshold: 3, success-threshold: 2, send-on-resolved: true, description: "journal không phản hồi" }
