# Các service/exporter bổ sung (2026-10-12). Gatus nạp cả thư mục /cfg/gatus.d. Cảnh báo -> alert-service như gatus.yaml.
endpoints:
  - name: analytics
    group: services
    url: "http://analytics:8000/healthz"
    interval: 30s
    conditions: ["[STATUS] == 200", "[RESPONSE_TIME] < 2000"]
    alerts:
      - { type: custom, failure-threshold: 3, success-threshold: 2, send-on-resolved: true, description: "analytics không phản hồi" }
  - name: pattern-engine
    group: services
    url: "http://pattern-engine:8000/healthz"
    interval: 30s
