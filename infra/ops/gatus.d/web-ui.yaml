# Endpoint web-ui (nginx nội bộ cổng 8080). Nếu gỡ web-ui khỏi compose thì xóa/đổi tên file này.
endpoints:
  - name: web-ui
    group: services
    url: "http://web-ui:8080/healthz"
    interval: 30s
    conditions: ["[STATUS] == 200", "[RESPONSE_TIME] < 2000"]
    alerts:
      - { type: custom, failure-threshold: 3, success-threshold: 2, send-on-resolved: true, description: "web-ui không phản hồi" }
