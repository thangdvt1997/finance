# vn-market (chứng khoán VN cuối ngày). Nếu gỡ service khỏi compose thì xóa file này.
endpoints:
  - name: vn-market
    group: services
    url: "http://vn-market:8000/healthz"
    interval: 30s
    conditions: ["[STATUS] == 200", "[RESPONSE_TIME] < 2000"]
    alerts:
      - { type: custom, failure-threshold: 3, success-threshold: 2, send-on-resolved: true, description: "vn-market không phản hồi" }
